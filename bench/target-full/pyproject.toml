# Stub target (full pipeline stack) for acumen, which benchmarks skills against an installable Python package.
# The package itself is empty: it pins the analysis stack the agent gets and puts an
# `Rscript` shim on the agent PATH (the sandbox PATH is only the venv bin plus /usr/bin).
[project]
name = "lucid-bench-target-full"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "anndata",
  "decoupler>=2",
  "matplotlib",
  "numpy",
  "pandas",
  "pydeseq2",
  "scanpy",
  "scipy",
  # extra stack for the pipeline skills (bench/pipelines); keep in sync with their uv lines
  "celltypist",
  "harmonypy",
  "igraph",
  "leidenalg",
  "scikit-learn<1.8",  # celltypist 1.7.1 needs sklearn's removed multi_class
  "scikit-misc",
  "h5py",
  "liana>=1.10",  # 1.8.0 crashes on anndata 0.13.4
  "mofapy2",
  "scikit-image",
  "threadpoolctl",
  "scvelo",
  "cellrank",
  "muon",
  "numpy<2.4",  # scvelo/cellrank
  "pandas<3",
]

[project.scripts]
Rscript = "lucid_bench_target_full.rscript:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
