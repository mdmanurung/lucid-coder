  train:
    prompt: '`kang2018_pb.h5ad` in the working directory holds Kang et al. 2018 PBMCs: raw
      UMI counts in `X`; `obs` columns `sample` (one id per patient x condition), `replicate`
      (patient), `label` (`ctrl` or `stim`, interferon-beta) and `cell_type`. Pseudobulk the
      CD14+ Monocytes: sum raw counts per `sample` over that cell type''s cells; drop samples
      with fewer than 20 cells; keep genes detected (count > 0) in at least 0.1 of the cells
      of the kept samples. Then test stim vs ctrl: design `~ replicate + label`, no fold-change
      shrinkage, independent-filtering alpha 0.05. Fit with PyDESeq2. A gene is significant
      when padj < 0.05 and |log2 fold change| > 1; a missing padj is not significant. Save
      the results table and figures in the working directory. Report only the number of significant
