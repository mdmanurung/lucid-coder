  # corpus: repos/immgenT-GP-analysis/code/R/cross_gp_helpers.R:16
  - id: heatmap
    data: [kang2018.h5ad]
    train:
      prompt: >-
        `kang2018.h5ad` in the working directory holds Kang et al. 2018 PBMCs: raw UMI
        counts in `X`; `obs` columns `label` (`ctrl` or `stim`, interferon-beta),
        `replicate` (patient id) and `cell_type`. Keep the six cell types B cells, CD14+
        Monocytes, CD4 T cells, CD8 T cells, FCGR3A+ Monocytes and NK cells. For each cell
        type x `label`, sum raw counts over all its cells (patients pooled) and convert to
        counts per million (CPM). Per gene and cell type, log2FC = log2(CPM_stim + 1) -
        log2(CPM_ctrl + 1). Among genes with at least 100 counts in CD14+ Monocytes (stim
        plus ctrl), take the 30 with the largest |log2FC| in CD14+ Monocytes. Centre each
        gene by subtracting its mean log2FC across the six cell types. Draw a heatmap of the
        centred values, genes by cell type, on a diverging colour scale capped at -2 and +2.
        Save the figure as files in the working directory. Report how many heatmap cells are
        saturated, that is have |centred value| > 2.
      answer: "32"
    valid:
      prompt: >-
        `kang2018.h5ad` in the working directory holds Kang et al. 2018 PBMCs: raw UMI
        counts in `X`; `obs` columns `label` (`ctrl` or `stim`, interferon-beta),
        `replicate` (patient id) and `cell_type`. Keep the six cell types B cells, CD14+
        Monocytes, CD4 T cells, CD8 T cells, FCGR3A+ Monocytes and NK cells. For each cell
        type x `label`, sum raw counts over all its cells (patients pooled) and convert to
        counts per million (CPM). Per gene and cell type, log2FC = log2(CPM_stim + 1) -
        log2(CPM_ctrl + 1). Among genes with at least 100 counts in NK cells (stim plus
        ctrl), take the 40 with the largest |log2FC| in NK cells. Centre each gene by
        subtracting its mean log2FC across the six cell types. Draw a heatmap of the centred
        values, genes by cell type, on a diverging colour scale capped at -1.5 and +1.5.
        Save the figure as files in the working directory. Report how many heatmap cells are
        saturated, that is have |centred value| > 1.5.
      answer: "14"
    test:
      prompt: >-
        `kang2018.h5ad` in the working directory holds Kang et al. 2018 PBMCs: raw UMI
        counts in `X`; `obs` columns `label` (`ctrl` or `stim`, interferon-beta),
        `replicate` (patient id) and `cell_type`. Keep the six cell types B cells, CD14+
        Monocytes, CD4 T cells, CD8 T cells, FCGR3A+ Monocytes and NK cells. For each cell
        type x `label`, sum raw counts over all its cells (patients pooled) and convert to
        counts per million (CPM). Per gene and cell type, log2FC = log2(CPM_stim + 1) -
        log2(CPM_ctrl + 1). Among genes with at least 100 counts in CD4 T cells (stim plus
        ctrl), take the 25 with the largest |log2FC| in CD4 T cells. Centre each gene by
        subtracting its mean log2FC across the six cell types. Draw a heatmap of the centred
        values, genes by cell type, on a diverging colour scale capped at -2 and +2. Save
        the figure as files in the working directory. Report how many heatmap cells are
        saturated, that is have |centred value| > 2.
      answer: "8"
