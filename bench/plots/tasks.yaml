# Plot tasks for the lucid-coder plot/style skill; see ../README.md.
# Each task mirrors a corpus figure procedure on Kang 2018 PBMCs. Corpus paths are relative to
# /exports/para-lipg-hpc/mdmanurung/mycelium-extra/plans/_DONE/lucidcoder/docs/cc_learnings.
# Answers are exact-match tokens; ../score_style.py scores plot style separately.
# Reproducers: tasks/<id>-<split>.py.

tasks:
  # corpus: repos/multiple-myeloma/analyses-rna/04-pseudobulk/l3-pseudobulk/13-plots-deseq2-volcano_fixed.ipynb:79-95
  - id: volcano
    data: [kang2018.h5ad]
    train:
      prompt: >-
        `kang2018.h5ad` in the working directory holds Kang et al. 2018 PBMCs: raw UMI
        counts in `X`; `obs` columns `label` (`ctrl` or `stim`, interferon-beta),
        `replicate` (patient id) and `cell_type`. Make a volcano plot of pseudobulk
        differential expression, stim vs ctrl, in B cells. Build one pseudobulk sample per
        `replicate` x `label` by summing raw counts over its cells; drop genes with fewer
        than 10 counts summed over all pseudobulk samples. Test with PyDESeq2, design `~
        replicate + label`, contrast stim vs ctrl, no fold-change shrinkage,
        independent-filtering alpha 0.1; drop genes with a missing padj. A gene is
        significant when padj < 0.1 and |log2 fold change| > 0.5; highlight the significant
        genes. Save the figure as files in the working directory. Report the number of
        significant genes.
      answer: "838"
    valid:
      prompt: >-
        `kang2018.h5ad` in the working directory holds Kang et al. 2018 PBMCs: raw UMI
        counts in `X`; `obs` columns `label` (`ctrl` or `stim`, interferon-beta),
        `replicate` (patient id) and `cell_type`. Make a volcano plot of pseudobulk
        differential expression, stim vs ctrl, in NK cells. Build one pseudobulk sample per
        `replicate` x `label` by summing raw counts over its cells; drop genes with fewer
        than 10 counts summed over all pseudobulk samples. Test with PyDESeq2, design `~
        replicate + label`, contrast stim vs ctrl, no fold-change shrinkage,
        independent-filtering alpha 0.05; drop genes with a missing padj. A gene is
        significant when padj < 0.05 and |log2 fold change| > 1; highlight the significant
        genes. Save the figure as files in the working directory. Report the number of
        significant genes.
      answer: "316"
    test:
      prompt: >-
        `kang2018.h5ad` in the working directory holds Kang et al. 2018 PBMCs: raw UMI
        counts in `X`; `obs` columns `label` (`ctrl` or `stim`, interferon-beta),
        `replicate` (patient id) and `cell_type`. Make a volcano plot of pseudobulk
        differential expression, stim vs ctrl, in CD8 T cells. Build one pseudobulk sample
        per `replicate` x `label` by summing raw counts over its cells; drop genes with
        fewer than 10 counts summed over all pseudobulk samples. Test with PyDESeq2, design
        `~ replicate + label`, contrast stim vs ctrl, no fold-change shrinkage,
        independent-filtering alpha 0.1; drop genes with a missing padj. A gene is
        significant when padj < 0.1 and |log2 fold change| > 1; highlight the significant
        genes. Save the figure as files in the working directory. Report the number of
        significant genes.
      answer: "178"
