# Method-free pilot tasks. Each prompt states the question, not the method.
# pseudorep: pseudoreplication trap. Sound: pseudobulk per donor (n=3 vs 3); naive: cells as
# replicates. Generated by `<target venv>/bin/python tasks/_pseudorep.py cache`; check
# robustness with tasks/_pseudorep_robust.py.
# repsample: paired design, two samples per donor. Sound: per-sample pseudobulk with a donor
# term; naive: `~ condition` or cells. Generated by `tasks/_repsample.py cache` (keeps other
# entries); check robustness with tasks/_repsample_robust.py.
tasks:
  - id: pseudorep
    train:
      data:
      - pseudorep_train.h5ad
      prompt: '`pseudorep_train.h5ad` in the working directory holds single-cell RNA-seq of one
        cell type from 6 donors: raw integer UMI counts in `X`, gene names as `var_names`, and `obs`
        columns `donor` (donor id), `condition` (`ctrl` or `stim`) and `cell_type`. How many of
        these 10 genes (AMD4, DTY9, FIO8, HWD4, NLR9, NYV8, OZZ2, QWJ2, UGR5, YOB5) differ in expression
        between stim and ctrl in this cell type, at an adjusted p-value below 0.05? Report only
        the number. Genome reference: none, synthetic genes. There is no one to ask: make each analysis
        choice yourself and state it. Report only the number.'
      answer: '3'
    valid:
      data:
      - pseudorep_valid.h5ad
      prompt: '`pseudorep_valid.h5ad` in the working directory holds single-cell RNA-seq of one
        cell type from 6 donors: raw integer UMI counts in `X`, gene names as `var_names`, and `obs`
        columns `donor` (donor id), `condition` (`ctrl` or `stim`) and `cell_type`. How many of
        these 10 genes (BHO2, CGQ1, FMU4, JPX3, KKE4, KQC6, LDZ3, MXI3, PNB4, WIV1) differ in expression
        between stim and ctrl in this cell type, at an adjusted p-value below 0.05? Report only
        the number. Genome reference: none, synthetic genes. There is no one to ask: make each analysis
        choice yourself and state it. Report only the number.'
      answer: '2'
    test:
      data:
      - pseudorep_test.h5ad
      prompt: '`pseudorep_test.h5ad` in the working directory holds single-cell RNA-seq of one cell
        type from 6 donors: raw integer UMI counts in `X`, gene names as `var_names`, and `obs`
        columns `donor` (donor id), `condition` (`ctrl` or `stim`) and `cell_type`. How many of
        these 10 genes (BCW4, DAY7, DKW1, DNS4, EUO1, JFR5, KGN1, NPG4, QYQ3, YTW5) differ in expression
        between stim and ctrl in this cell type, at an adjusted p-value below 0.05? Report only
        the number. Genome reference: none, synthetic genes. There is no one to ask: make each analysis
        choice yourself and state it. Report only the number.'
      answer: '4'
  - id: repsample
    train:
      data:
      - repsample_train.h5ad
      prompt: '`repsample_train.h5ad` in the working directory holds single-cell RNA-seq of one
        cell type from 7 donors: raw integer UMI counts in `X`, gene names as `var_names`, and `obs`
        columns `donor` (donor id), `sample` (sample id) and `condition` (`ctrl` or `stim`). How
        many of these 10 genes (BAG3, HJX7, KKJ5, MOA7, NBJ4, QMJ6, UIR1, WDJ1, XSO9, ZRF8) differ
        in expression between stim and ctrl in this cell type, at an adjusted p-value below 0.05?
        Report only the number. Genome reference: none, synthetic genes. There is no one to ask:
        make each analysis choice yourself and state it. Report only the number.'
      answer: '5'
    valid:
      data:
      - repsample_valid.h5ad
      prompt: '`repsample_valid.h5ad` in the working directory holds single-cell RNA-seq of one
        cell type from 8 donors: raw integer UMI counts in `X`, gene names as `var_names`, and `obs`
        columns `donor` (donor id), `sample` (sample id) and `condition` (`ctrl` or `stim`). How
        many of these 10 genes (DDL5, DMS2, FYX8, HIL3, IGU6, NXJ4, OLM7, OLV9, SMM7, YAR9) differ
        in expression between stim and ctrl in this cell type, at an adjusted p-value below 0.05?
        Report only the number. Genome reference: none, synthetic genes. There is no one to ask:
        make each analysis choice yourself and state it. Report only the number.'
      answer: '3'
    test:
      data:
      - repsample_test.h5ad
      prompt: '`repsample_test.h5ad` in the working directory holds single-cell RNA-seq of one cell
        type from 6 donors: raw integer UMI counts in `X`, gene names as `var_names`, and `obs`
        columns `donor` (donor id), `sample` (sample id) and `condition` (`ctrl` or `stim`). How
        many of these 10 genes (ABQ2, FOH1, GAG7, ISF7, LXV5, VGN8, VHH8, VZC6, XMO9, YSF3) differ
        in expression between stim and ctrl in this cell type, at an adjusted p-value below 0.05?
        Report only the number. Genome reference: none, synthetic genes. There is no one to ask:
        make each analysis choice yourself and state it. Report only the number.'
      answer: '4'
