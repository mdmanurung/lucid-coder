# Stub target for acumen, which benchmarks skills against an installable Python package.
# The package itself is empty: it pins the analysis stack the agent gets and puts an
# `Rscript` shim on the agent PATH (the sandbox PATH is only the venv bin plus /usr/bin).
[project]
name = "lucid-bench-target"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "anndata",
  "decoupler>=2",
  "matplotlib",
  "numpy",
  "pandas",
  "pydeseq2",
  "scanpy",
  "scipy",
]

[project.scripts]
Rscript = "lucid_bench_target.rscript:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
