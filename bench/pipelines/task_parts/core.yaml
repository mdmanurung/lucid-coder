  # skill: sc-embed; corpus: B-an-06 (normalise, HVG, scale, arpack PCA, Harmony max_iter 20, kNN, UMAP), C-an-05 (leiden igraph, n_iterations=2)
  - id: embed
    data:
    - kang2018.h5ad
    train:
      prompt: '`kang2018.h5ad` in the working directory holds Kang et al. 2018 PBMCs: raw UMI
        counts in `X`; `obs` columns `label` (`ctrl` or `stim`, interferon-beta), `replicate`
        (patient id) and `cell_type`. Embed and cluster the CD8 T cells, both conditions together.
        Keep the raw counts in a layer; normalise each cell to 10,000 total counts, then log1p.
        Pick the 2,000 most highly variable genes with the `seurat` flavor on the log-normalised
        data, with `replicate` as the batch key. Scale those genes to zero mean and unit variance
        with no clipping and run PCA with 30 components and the ARPACK solver. Integrate the
        PCs by `replicate` with harmonypy''s `run_harmony` (at most 20 iterations). Build a
        15-neighbour kNN graph on the first 20 Harmony-corrected components, compute a UMAP
        with min_dist 0.3, and run Leiden clustering (igraph flavor, 2 iterations, undirected
        graph) at resolution 0.4. Use seed 0 for PCA, Harmony, neighbours, UMAP and Leiden.
        Save the embedded h5ad, a cluster-size table and UMAP figures in the working directory.
        Report only the number of Leiden clusters. Genome reference: GRCh37 (hg19), 10x Cell
        Ranger hg19 annotation.'
      answer: '3'
    valid:
      prompt: '`kang2018.h5ad` in the working directory holds Kang et al. 2018 PBMCs: raw UMI
        counts in `X`; `obs` columns `label` (`ctrl` or `stim`, interferon-beta), `replicate`
        (patient id) and `cell_type`. Embed and cluster the NK cells, both conditions together.
        Keep the raw counts in a layer; normalise each cell to 10,000 total counts, then log1p.
        Pick the 2,000 most highly variable genes with the `seurat` flavor on the log-normalised
        data, with `replicate` as the batch key. Scale those genes to zero mean and unit variance
        with no clipping and run PCA with 30 components and the ARPACK solver. Integrate the
        PCs by `replicate` with harmonypy''s `run_harmony` (at most 20 iterations). Build a
        15-neighbour kNN graph on the first 20 Harmony-corrected components, compute a UMAP
        with min_dist 0.3, and run Leiden clustering (igraph flavor, 2 iterations, undirected
        graph) at resolution 0.5. Use seed 0 for PCA, Harmony, neighbours, UMAP and Leiden.
        Save the embedded h5ad, a cluster-size table and UMAP figures in the working directory.
        Report only the number of Leiden clusters. Genome reference: GRCh37 (hg19), 10x Cell
        Ranger hg19 annotation.'
      answer: '5'
    test:
      prompt: '`kang2018.h5ad` in the working directory holds Kang et al. 2018 PBMCs: raw UMI
        counts in `X`; `obs` columns `label` (`ctrl` or `stim`, interferon-beta), `replicate`
        (patient id) and `cell_type`. Embed and cluster the B cells, both conditions together.
