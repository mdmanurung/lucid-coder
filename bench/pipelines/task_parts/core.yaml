        Ranger hg19 annotation.'
      answer: '6'
  # skill: sc-markers; corpus: D-an-40 (Wilcoxon, benjamini-hochberg, reference='rest', use_raw=False)
  - id: markers
    data:
    - kang2018.h5ad
    train:
      prompt: '`kang2018.h5ad` in the working directory holds Kang et al. 2018 PBMCs: raw UMI
        counts in `X`; `obs` columns `label` (`ctrl` or `stim`, interferon-beta), `replicate`
        (patient id) and `cell_type`. Find marker genes for each `cell_type` among the ctrl
        cells only. Normalise each cell to 10,000 total counts, then log1p. Test each cell type
        against all other cells with a Wilcoxon rank-sum test (scanpy `rank_genes_groups`, every
        gene, Benjamini-Hochberg correction, on the log-normalised values, not `.raw`). A gene
        is a marker of a cell type when its adjusted p < 0.05, its log2 fold change (scanpy''s,
        up in that type) > 1, and it is detected (value > 0) in at least 0.25 of that type''s
        cells. Save the full marker table, a dot plot and a heatmap of the top 5 markers per
        cell type in the working directory. Report only the number of markers of B cells. Genome
        reference: GRCh37 (hg19), 10x Cell Ranger hg19 annotation.'
      answer: '50'
    valid:
      prompt: '`kang2018.h5ad` in the working directory holds Kang et al. 2018 PBMCs: raw UMI
        counts in `X`; `obs` columns `label` (`ctrl` or `stim`, interferon-beta), `replicate`
        (patient id) and `cell_type`. Find marker genes for each `cell_type` among the stim
        cells only. Normalise each cell to 10,000 total counts, then log1p. Test each cell type
        against all other cells with a Wilcoxon rank-sum test (scanpy `rank_genes_groups`, every
        gene, Benjamini-Hochberg correction, on the log-normalised values, not `.raw`). A gene
        is a marker of a cell type when its adjusted p < 0.01, its log2 fold change (scanpy''s,
        up in that type) > 1.5, and it is detected (value > 0) in at least 0.3 of that type''s
        cells. Save the full marker table, a dot plot and a heatmap of the top 5 markers per
        cell type in the working directory. Report only the number of markers of NK cells. Genome
        reference: GRCh37 (hg19), 10x Cell Ranger hg19 annotation.'
      answer: '29'
    test:
      prompt: '`kang2018.h5ad` in the working directory holds Kang et al. 2018 PBMCs: raw UMI
        counts in `X`; `obs` columns `label` (`ctrl` or `stim`, interferon-beta), `replicate`
        (patient id) and `cell_type`. Find marker genes for each `cell_type` among the ctrl
        cells only. Normalise each cell to 10,000 total counts, then log1p. Test each cell type
        against all other cells with a Wilcoxon rank-sum test (scanpy `rank_genes_groups`, every
        gene, Benjamini-Hochberg correction, on the log-normalised values, not `.raw`). A gene
        is a marker of a cell type when its adjusted p < 0.05, its log2 fold change (scanpy''s,
        up in that type) > 0.5, and it is detected (value > 0) in at least 0.2 of that type''s
        cells. Save the full marker table, a dot plot and a heatmap of the top 5 markers per
        cell type in the working directory. Report only the number of markers of CD8 T cells.
        Genome reference: GRCh37 (hg19), 10x Cell Ranger hg19 annotation.'
      answer: '86'
  # skill: sc-annotate; corpus: B-an-04 / D-an-41 (train CellTypist on a log1p-1e4 reference by a label column, annotate with majority voting toggled)
  - id: annotate
    data:
    - core_kang_stim_ref.h5ad
    - core_kang_ctrl_query.h5ad
    - core_pbmc_markers.tsv
    train:
      prompt: '`core_kang_stim_ref.h5ad` in the working directory holds the interferon-beta
        stimulated PBMCs of Kang et al. 2018: raw UMI counts in `X`, `obs` column `cell_type`.
        `core_kang_ctrl_query.h5ad` holds the control PBMCs: raw UMI counts in `X`, a UMAP in
        `obsm[''X_umap'']`, `obs` columns `replicate` and `cell_type`. `core_pbmc_markers.tsv`
        lists marker genes per label (columns `label`, `gene`). Transfer labels from the stimulated
        cells to the control cells with CellTypist: normalise copies of both to 10,000 counts
        per cell, then log1p; train a model on the stimulated cells by `cell_type` with `celltypist.train`
        (default solver, n_jobs 1, random state 0); annotate the control cells with it in best-match
        mode without majority voting. Tabulate the transferred labels by the control cells''
        `cell_type`, and check them against the marker genes in a dot plot. Save the annotated
        h5ad, the tables and the figures in the working directory. Report only the number of
        control cells with `cell_type` CD8 T cells whose transferred label is also CD8 T cells.
        Genome reference: GRCh37 (hg19), 10x Cell Ranger hg19 annotation.'
      answer: '586'
    valid:
      prompt: '`core_kang_stim_ref.h5ad` in the working directory holds the interferon-beta
        stimulated PBMCs of Kang et al. 2018: raw UMI counts in `X`, `obs` column `cell_type`.
