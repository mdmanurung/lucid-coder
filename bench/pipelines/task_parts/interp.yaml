  # skill: ccc; corpus C-an-31 (liana consensus resource, expr_prop, n_perms)
  - id: ccc
    data:
    - kang2018_lognorm.h5ad
    - liana_consensus.tsv
    train:
      prompt: '`kang2018_lognorm.h5ad` in the working directory holds Kang et al. 2018 PBMCs:
        log-normalised values in `X` (`normalize_total` to 10,000 then `log1p`); `obs` columns
        `sample` (one id per patient x condition, e.g. `patient_101_ctrl`), `replicate` (patient),
        `label` (`ctrl` or `stim`, interferon-beta) and `cell_type`. Take the `ctrl` cells.
        `liana_consensus.tsv` is liana''s consensus ligand-receptor resource (columns `ligand`,
        `receptor`). Run liana''s rank aggregate of all five methods (CellPhoneDB, Connectome,
        log2FC, NATMI, SingleCellSignalR) between all `cell_type` pairs with this resource:
        expr_prop 0.1, min_cells 5, n_perms 100, seed 0, use_raw False, one job and one BLAS
        thread. An interaction passes when magnitude_rank <= 0.01 and specificity_rank <= 0.05.
        Save the results tables and figures in the working directory. Report only the number
        of passing interactions. Genome reference: GRCh37 (hg19), 10x Cell Ranger hg19 annotation.'
      answer: '5'
    valid:
      prompt: '`kang2018_lognorm.h5ad` in the working directory holds Kang et al. 2018 PBMCs:
        log-normalised values in `X` (`normalize_total` to 10,000 then `log1p`); `obs` columns
