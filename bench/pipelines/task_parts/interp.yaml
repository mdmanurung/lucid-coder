  # skill: signature-scoring; corpus A-an-14 (score_genes ctrl_size/n_bins, per-group means)
  - id: signature
    data:
    - kang2018_lognorm.h5ad
    train:
      prompt: '`kang2018_lognorm.h5ad` in the working directory holds Kang et al. 2018 PBMCs:
        log-normalised values in `X` (`normalize_total` to 10,000 then `log1p`); `obs` columns
        `sample` (one id per patient x condition, e.g. `patient_101_ctrl`), `replicate` (patient),
        `label` (`ctrl` or `stim`, interferon-beta) and `cell_type`. Take only the cells whose
        `cell_type` is B cells (subset first, then score). Score the gene set `ifn` (ISG15,
        IFI6, IFIT1, IFIT3, MX1, OAS1, IFITM3, LY6E, IRF7, RSAD2, ISG20, IFI44L) in every cell
        with scanpy `sc.tl.score_genes`: ctrl_size 50, n_bins 25, random_state 0, use_raw False;
        require at least 5 of the set''s genes in the data. Average the score per `sample` (samples
        nest in `label`, the groups). As a control, also score 20 random gene sets of the same
        size drawn from the other genes (seed 0) the same way. Save the results tables and figures
        in the working directory. Report only the `sample` with the highest mean score. Genome
        reference: GRCh37 (hg19), 10x Cell Ranger hg19 annotation.'
      answer: patient_1015_stim
    valid:
      prompt: '`kang2018_lognorm.h5ad` in the working directory holds Kang et al. 2018 PBMCs:
        log-normalised values in `X` (`normalize_total` to 10,000 then `log1p`); `obs` columns
        `sample` (one id per patient x condition, e.g. `patient_101_ctrl`), `replicate` (patient),
        `label` (`ctrl` or `stim`, interferon-beta) and `cell_type`. Take only the cells whose
        `cell_type` is B cells (subset first, then score). Score the gene set `mhc2` (HLA-DRA,
        HLA-DRB1, HLA-DPA1, HLA-DPB1, HLA-DQA1, HLA-DQB1, CD74) in every cell with scanpy `sc.tl.score_genes`:
        ctrl_size 50, n_bins 25, random_state 0, use_raw False; require at least 5 of the set''s
        genes in the data. Average the score per `sample` (samples nest in `label`, the groups).
        As a control, also score 20 random gene sets of the same size drawn from the other genes
        (seed 0) the same way. Save the results tables and figures in the working directory.
        Report only the `sample` with the highest mean score. Genome reference: GRCh37 (hg19),
        10x Cell Ranger hg19 annotation.'
      answer: patient_1016_ctrl
    test:
      prompt: '`kang2018_lognorm.h5ad` in the working directory holds Kang et al. 2018 PBMCs:
        log-normalised values in `X` (`normalize_total` to 10,000 then `log1p`); `obs` columns
        `sample` (one id per patient x condition, e.g. `patient_101_ctrl`), `replicate` (patient),
        `label` (`ctrl` or `stim`, interferon-beta) and `cell_type`. Take only the cells whose
        `cell_type` is CD14+ Monocytes (subset first, then score). Score the gene set `mhc2`
        (HLA-DRA, HLA-DRB1, HLA-DPA1, HLA-DPB1, HLA-DQA1, HLA-DQB1, CD74) in every cell with
        scanpy `sc.tl.score_genes`: ctrl_size 100, n_bins 25, random_state 0, use_raw False;
        require at least 5 of the set''s genes in the data. Average the score per `sample` (samples
        nest in `label`, the groups). As a control, also score 20 random gene sets of the same
        size drawn from the other genes (seed 0) the same way. Save the results tables and figures
        in the working directory. Report only the `sample` with the highest mean score. Genome
        reference: GRCh37 (hg19), 10x Cell Ranger hg19 annotation.'
      answer: patient_1016_stim
  # skill: tf-activity; corpus A-an-27 (CollecTRI + ULM, rank_sources_groups vs rest)
  - id: tfact
    data:
    - kang2018_lognorm.h5ad
    - collectri_human.tsv
    train:
      prompt: '`kang2018_lognorm.h5ad` in the working directory holds Kang et al. 2018 PBMCs:
        log-normalised values in `X` (`normalize_total` to 10,000 then `log1p`); `obs` columns
        `sample` (one id per patient x condition, e.g. `patient_101_ctrl`), `replicate` (patient),
        `label` (`ctrl` or `stim`, interferon-beta) and `cell_type`. Take the `ctrl` cells.
        `collectri_human.tsv` is the CollecTRI network (columns `source`, `target`, `weight`).
        Infer TF activity per cell with decoupler''s univariate linear model (`dc.mt.ulm`, tmin
        5). Then rank the sources per `cell_type` against the rest with `dc.tl.rankby_group`
        (reference `rest`, method `t-test_overestim_var`). Save the results tables and figures
        in the working directory. Report only the source with the highest statistic in CD8 T
        cells. Genome reference: GRCh37 (hg19), 10x Cell Ranger hg19 annotation.'
      answer: KLF13
    valid:
      prompt: '`kang2018_lognorm.h5ad` in the working directory holds Kang et al. 2018 PBMCs:
        log-normalised values in `X` (`normalize_total` to 10,000 then `log1p`); `obs` columns
