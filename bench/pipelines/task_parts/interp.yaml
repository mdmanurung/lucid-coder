tasks:
  # skill: group-tests; corpus C-an-47 (paired Wilcoxon of scores pre/post), C-an-20, C-an-48
  - id: grouptest
    data:
    - kang2018_lognorm.h5ad
    train:
      prompt: '`kang2018_lognorm.h5ad` in the working directory holds Kang et al. 2018 PBMCs:
        log-normalised values in `X` (`normalize_total` to 10,000 then `log1p`); `obs` columns
        `sample` (one id per patient x condition, e.g. `patient_101_ctrl`), `replicate` (patient),
        `label` (`ctrl` or `stim`, interferon-beta) and `cell_type`. Take the cells whose `cell_type`
        is CD4 T cells. For each `sample`, compute the mean log-normalised value over its cells
        of each of these 30 genes: ISG15, IFI6, IFIT1, IFIT3, MX1, OAS1, IFITM3, LY6E, STAT1,
        IRF7, CD3E, CD14, LYZ, MS4A1, NKG7, GNLY, ACTB, GAPDH, B2M, CCL5, S100A8, S100A9, FCGR3A,
        HLA-DRA, CD74, IL7R, CCR7, FTL, FTH1, TMSB4X. Test each gene stim vs ctrl with a two-sided
        paired Wilcoxon signed-rank test, pairing the two samples of each `replicate` (ctrl
        is the reference, so differences are stim minus ctrl; complete pairs only; zero differences
        dropped; exact p-values as scipy gives for 8 pairs). Correct across the genes with Benjamini-Hochberg.
        A gene is significant when the adjusted p-value < 0.05. Save the results tables and
        figures in the working directory. Report only the number of significant genes. Genome
        reference: GRCh37 (hg19), 10x Cell Ranger hg19 annotation.'
      answer: '22'
    valid:
      prompt: '`kang2018_lognorm.h5ad` in the working directory holds Kang et al. 2018 PBMCs:
        log-normalised values in `X` (`normalize_total` to 10,000 then `log1p`); `obs` columns
        `sample` (one id per patient x condition, e.g. `patient_101_ctrl`), `replicate` (patient),
        `label` (`ctrl` or `stim`, interferon-beta) and `cell_type`. Take the cells whose `cell_type`
        is NK cells. For each `sample`, compute the mean log-normalised value over its cells
        of each of these 30 genes: ISG15, IFI6, IFIT1, IFIT3, MX1, OAS1, IFITM3, LY6E, STAT1,
        IRF7, CD3E, CD14, LYZ, MS4A1, NKG7, GNLY, ACTB, GAPDH, B2M, CCL5, S100A8, S100A9, FCGR3A,
        HLA-DRA, CD74, IL7R, CCR7, FTL, FTH1, TMSB4X. Test each gene stim vs ctrl with a two-sided
        paired Wilcoxon signed-rank test, pairing the two samples of each `replicate` (ctrl
        is the reference, so differences are stim minus ctrl; complete pairs only; zero differences
        dropped; exact p-values as scipy gives for 8 pairs). Correct across the genes with Benjamini-Hochberg.
        A gene is significant when the adjusted p-value < 0.1. Save the results tables and figures
        in the working directory. Report only the number of significant genes. Genome reference:
        GRCh37 (hg19), 10x Cell Ranger hg19 annotation.'
      answer: '16'
    test:
      prompt: '`kang2018_lognorm.h5ad` in the working directory holds Kang et al. 2018 PBMCs:
        log-normalised values in `X` (`normalize_total` to 10,000 then `log1p`); `obs` columns
        `sample` (one id per patient x condition, e.g. `patient_101_ctrl`), `replicate` (patient),
        `label` (`ctrl` or `stim`, interferon-beta) and `cell_type`. Take the cells whose `cell_type`
        is B cells. For each `sample`, compute the mean log-normalised value over its cells
