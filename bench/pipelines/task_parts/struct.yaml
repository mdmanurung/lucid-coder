# struct group: trajectory, gene-programs, mofa, pseudobulk-de; generated by
# `<target venv>/bin/python tasks/_structg.py <cache>` from tasks/_structg.py SPEC.
tasks:
  # skill: mofa; corpus C-an-32 (MOFA2 on pseudobulk views)
  - id: mofa
    data:
    - struct_mofa
    train:
      prompt: 'The directory `struct_mofa/` in the working directory holds pseudobulk views of Kang
        et al. 2018 PBMCs, 16 samples (8 patients x `ctrl`/`stim` interferon-beta): one TSV per
        cell type named `<view>.tsv`, samples in rows (first column `sample`), log2(CPM + 1) features
        named `<view>_<gene>`; and `meta.tsv` with columns `sample`, `label` and `replicate`. Run
        MOFA2 (mofapy2) on the views `b`, `mono14`, `nk`: every view Gaussian, 5 factors, views
        scaled to unit variance, convergence mode `fast`, seed 0, no factor dropped during training
        (`dropR2=None`), on CPU. Sort views, samples and features before building the model. Number
        the factors in the order of the saved model (mofapy2 sorts them by variance explained when
        saving), so Factor1 explains the most. A factor is active when its variance explained (R²,
        in %) is >= 15 in at least one view. Colour and test factors by `label`. Save the result
        tables and figures in the working directory. Report only `<view in which Factor1 has the
        largest R²>/<number of active factors>`, for example `cd8t/3`. Genome reference: GRCh37
        (hg19), 10x Cell Ranger hg19 annotation.'
      answer: mono14/2
    valid:
      prompt: 'The directory `struct_mofa/` in the working directory holds pseudobulk views of Kang
