        change| > 2; a missing padj is not significant. Save the result tables and figures in the
        working directory. Report only `<significant genes up in stim>/<significant genes down in
        stim>`, for example `120/45`. Genome reference: GRCh37 (hg19), 10x Cell Ranger hg19 annotation.'
      answer: 43/0
    test:
      prompt: '`kang2018_pb.h5ad` in the working directory holds Kang et al. 2018 PBMCs: raw UMI
