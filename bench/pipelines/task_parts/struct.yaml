      answer: GP2/ISG20
    test:
      prompt: '`kang2018.h5ad` in the working directory holds Kang et al. 2018 PBMCs: raw UMI counts
        in `X`; `obs` columns `label` (`ctrl` or `stim`, interferon-beta), `replicate` (patient
