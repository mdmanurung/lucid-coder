  # skill: pseudobulk-de (python engine); corpus B-an-11 (sum per sample), B-an-14 (10%-style detection filter), B-an-13 (DESeq2 per cell type)
  - id: pbde
    data:
    - kang2018_pb.h5ad
    train:
      prompt: '`kang2018_pb.h5ad` in the working directory holds Kang et al. 2018 PBMCs: raw UMI
        counts in `X`; `obs` columns `sample` (one id per patient x condition), `replicate` (patient),
        `label` (`ctrl` or `stim`, interferon-beta) and `cell_type`. Pseudobulk the FCGR3A+ Monocytes:
        sum raw counts per `sample` over that cell type''s cells; drop samples with fewer than 20
        cells; keep genes detected (count > 0) in at least 0.2 of the cells of the kept samples.
        Then test stim vs ctrl with PyDESeq2: design `~ replicate + label`, no fold-change shrinkage,
        independent-filtering alpha 0.01. A gene is significant when padj < 0.01 and |log2 fold
        change| > 1.5; a missing padj is not significant. Save the result tables and figures in
        the working directory. Report only `<significant genes up in stim>/<significant genes down
        in stim>`, for example `120/45`. Genome reference: GRCh37 (hg19), 10x Cell Ranger hg19 annotation.'
      answer: 134/19
    valid:
      prompt: '`kang2018_pb.h5ad` in the working directory holds Kang et al. 2018 PBMCs: raw UMI
        counts in `X`; `obs` columns `sample` (one id per patient x condition), `replicate` (patient),
        `label` (`ctrl` or `stim`, interferon-beta) and `cell_type`. Pseudobulk the CD4 T cells:
        sum raw counts per `sample` over that cell type''s cells; drop samples with fewer than 100
        cells; keep genes detected (count > 0) in at least 0.15 of the cells of the kept samples.
        Then test stim vs ctrl with PyDESeq2: design `~ replicate + label`, no fold-change shrinkage,
