  # skill: gene-programs; corpus C-an-29 (NMF gene programs), D-an-22 (seeded NMF fit), D-an-23 (one-vs-rest AUC of program usage)
  - id: programs
    data:
    - kang2018.h5ad
    train:
      prompt: '`kang2018.h5ad` in the working directory holds Kang et al. 2018 PBMCs: raw UMI counts
        in `X`; `obs` columns `label` (`ctrl` or `stim`, interferon-beta), `replicate` (patient
        id) and `cell_type`. Find gene programs by consensus NMF (cNMF-style) in the B cells of
        patients patient_1015 and patient_1488 (`replicate`). (1) HVGs: among genes with non-zero
        total counts in this subset, the top 500 by scanpy `highly_variable_genes(flavor=''seurat'')`
        on a copy run through `normalize_total(target_sum=1e4)` and `log1p`. (2) NMF input: the
        raw counts of those HVGs, each gene divided by its standard deviation over cells (population
        sd, not centred). (3) Fit scikit-learn `NMF` 12 times with 3 components, `init=''random''`,
        `solver=''cd''`, Frobenius loss, `max_iter=1000`; run i uses `random_state` equal to element
        i of `numpy.random.default_rng(0).integers(1, 2**31 - 1, 12)`. (4) Consensus: L2-normalise
        each of the 3 x 12 components and keep all of them (no density filter); cluster them with
        `KMeans(n_clusters=3, n_init=10, random_state=0)`; the element-wise median of each cluster,
        scaled to sum 1, is a consensus spectrum. (5) Usage: `non_negative_factorization` of the
        NMF input with the consensus spectra fixed (`update_H=False`, `solver=''cd''`, `max_iter=1000`),
        then scale each cell''s usage to sum 1. (6) Name the programs GP1 to GP3 by total usage
        over cells, largest first. (7) Gene scores, for every gene expressed in the subset: z-score
        each gene''s TPM (counts scaled to 1e6 per cell; population sd) over cells, then take the
        least-squares coefficients `pinv(usage) @ Z`. The program most active in stim cells is the
        one whose usage has the highest one-vs-rest ROC AUC for `label` stim. Save the result tables
        and figures in the working directory. Report only `<program name>/<its highest-scoring gene>`,
        for example `GP3/CD74`. Genome reference: GRCh37 (hg19), 10x Cell Ranger hg19 annotation.'
      answer: GP1/ISG20
    valid:
      prompt: '`kang2018.h5ad` in the working directory holds Kang et al. 2018 PBMCs: raw UMI counts
        in `X`; `obs` columns `label` (`ctrl` or `stim`, interferon-beta), `replicate` (patient
