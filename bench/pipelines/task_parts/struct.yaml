  # skill: trajectory; corpus C-an-35 (sc.tl.paga on cluster groups), A-an-31 (fixed PAGA edge threshold), B-an-26 (seeded diffusion map)
  - id: traj
    data:
    - struct_traj.h5ad
    train:
      prompt: '`struct_traj.h5ad` in the working directory holds an embedded single-cell dataset:
        log-normalised values in `X`, a neighbour graph (`uns[''neighbors'']`, `obsp[''connectivities'']`),
        a UMAP in `obsm[''X_umap'']`, and `obs` column `cluster` (groups `g1` to `g7`). Infer the
        trajectory with scanpy, keeping the stored neighbour graph (do not recompute it). Run PAGA
        on `cluster`. Run a diffusion map with 10 components and `random_state` 0. The root cell
        is the first cell of group `g1` in obs order; run diffusion pseudotime (DPT) from it with
        10 diffusion components and no branching. A pair of groups is a PAGA edge when its connectivity
        is >= 0.2. Cells with infinite pseudotime are left out of the group medians. Save the pseudotime
        table, the PAGA connectivity table and figures (PAGA graph, UMAP coloured by pseudotime,
        pseudotime per group) in the working directory. Report only `<number of PAGA edges>/<group
        with the highest median pseudotime>`, for example `3/g5`. Genome reference: none, synthetic
        genes.'
      answer: 7/g2
    valid:
      prompt: '`struct_traj.h5ad` in the working directory holds an embedded single-cell dataset:
        log-normalised values in `X`, a neighbour graph (`uns[''neighbors'']`, `obsp[''connectivities'']`),
        a UMAP in `obsm[''X_umap'']`, and `obs` column `cluster` (groups `g1` to `g7`). Infer the
        trajectory with scanpy, keeping the stored neighbour graph (do not recompute it). Run PAGA
        on `cluster`. Run a diffusion map with 8 components and `random_state` 1. The root cell
        is the first cell of group `g2` in obs order; run diffusion pseudotime (DPT) from it with
        8 diffusion components and no branching. A pair of groups is a PAGA edge when its connectivity
        is >= 0.42. Cells with infinite pseudotime are left out of the group medians. Save the pseudotime
        table, the PAGA connectivity table and figures (PAGA graph, UMAP coloured by pseudotime,
        pseudotime per group) in the working directory. Report only `<number of PAGA edges>/<group
        with the highest median pseudotime>`, for example `3/g5`. Genome reference: none, synthetic
        genes.'
      answer: 5/g4
    test:
      prompt: '`struct_traj.h5ad` in the working directory holds an embedded single-cell dataset:
