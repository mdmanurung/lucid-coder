  # skill: sc-annotate; corpus: B-an-04 / D-an-41 (train CellTypist on a log1p-1e4 reference by a label column, annotate with majority voting toggled)
  - id: annotate
    data:
    - core_kang_stim_ref.h5ad
    - core_kang_ctrl_query.h5ad
    - core_pbmc_markers.tsv
    train:
      prompt: '`core_kang_stim_ref.h5ad` in the working directory holds the interferon-beta
        stimulated PBMCs of Kang et al. 2018: raw UMI counts in `X`, `obs` column `cell_type`.
        `core_kang_ctrl_query.h5ad` holds the control PBMCs: raw UMI counts in `X`, a UMAP in
        `obsm[''X_umap'']`, `obs` columns `replicate` and `cell_type`. `core_pbmc_markers.tsv`
        lists marker genes per label (columns `label`, `gene`). Transfer labels from the stimulated
        cells to the control cells with CellTypist: normalise copies of both to 10,000 counts
        per cell, then log1p; train a model on the stimulated cells by `cell_type` with `celltypist.train`
        (default solver, n_jobs 1, random state 0); annotate the control cells with it in best-match
        mode without majority voting. Tabulate the transferred labels by the control cells''
        `cell_type`, and check them against the marker genes in a dot plot. Save the annotated
        h5ad, the tables and the figures in the working directory. Report only the number of
        control cells with `cell_type` CD8 T cells whose transferred label is also CD8 T cells.
        Genome reference: GRCh37 (hg19), 10x Cell Ranger hg19 annotation.'
      answer: '586'
    valid:
      prompt: '`core_kang_stim_ref.h5ad` in the working directory holds the interferon-beta
