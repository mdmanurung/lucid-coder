  # skill: sc-markers; corpus: D-an-40 (Wilcoxon, benjamini-hochberg, reference='rest', use_raw=False)
  - id: markers
    data:
    - kang2018.h5ad
    train:
      prompt: '`kang2018.h5ad` in the working directory holds Kang et al. 2018 PBMCs: raw UMI
        counts in `X`; `obs` columns `label` (`ctrl` or `stim`, interferon-beta), `replicate`
        (patient id) and `cell_type`. Find marker genes for each `cell_type` among the ctrl
        cells only. Normalise each cell to 10,000 total counts, then log1p. Test each cell type
        against all other cells with a Wilcoxon rank-sum test (scanpy `rank_genes_groups`, every
        gene, Benjamini-Hochberg correction, on the log-normalised values, not `.raw`). A gene
        is a marker of a cell type when its adjusted p < 0.05, its log2 fold change (scanpy''s,
        up in that type) > 1, and it is detected (value > 0) in at least 0.25 of that type''s
        cells. Save the full marker table, a dot plot and a heatmap of the top 5 markers per
        cell type in the working directory. Report only the number of markers of B cells. Genome
        reference: GRCh37 (hg19), 10x Cell Ranger hg19 annotation.'
      answer: '50'
    valid:
      prompt: '`kang2018.h5ad` in the working directory holds Kang et al. 2018 PBMCs: raw UMI
        counts in `X`; `obs` columns `label` (`ctrl` or `stim`, interferon-beta), `replicate`
