  # skill: sc-qc; corpus: B-an-01 (Scrublet per sample, seeded), B-an-02 (fixed mito/gene limits, drop predicted_doublet)
  - id: qc
    data:
    - core_pbmc3k.h5ad
    train:
      prompt: '`core_pbmc3k.h5ad` in the working directory holds the 10x PBMC 3k library: raw
        UMI counts in `X`, gene symbols as `var_names`, and `obs` column `sample` (one library).
        Run cell QC and doublet removal. Compute per-cell QC metrics on the raw counts; mitochondrial
        genes start with `MT-`. Score doublets on all cells before any filtering with scanpy''s
        `sc.pp.scrublet`, per `sample`: expected doublet rate 0.06, 30 principal components,
        exact nearest neighbours (no approximate search), random state 0, and Scrublet''s own
        automatic threshold; a cell is a doublet when its score exceeds that threshold. Keep
        a cell when it has 200 to 2500 genes detected (inclusive), at least 500 UMI counts,
        at most 5% mitochondrial counts, and is not a predicted doublet. Save the filtered h5ad,
        a per-cell QC table and QC figures in the working directory. Report only the number
        of cells kept. Genome reference: GRCh37 (hg19), 10x Cell Ranger hg19 annotation.'
      answer: '2597'
    valid:
      prompt: '`core_pbmc3k.h5ad` in the working directory holds the 10x PBMC 3k library: raw
