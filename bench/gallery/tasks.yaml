  # rule: effects with intervals: forest plot, reference line at 0, ordered by value (fig.wilke)
  - id: forest
    train:
      data: [de.tsv]
      prompt: >-
        `de.tsv` (tab-separated) holds pseudobulk differential expression, stim vs ctrl, for Kang et
        al. 2018 PBMCs (`ctrl` or `stim`, interferon-beta), per cell type: a paired t-test across 8
        donors on log2 CPM of summed counts. Columns: `cell_type`, `gene`, `log2fc` (stim minus
        ctrl), `se` (standard error of `log2fc`), `pvalue` and `padj` (Benjamini-Hochberg within
        cell type). For the 15 genes with the smallest `padj` in B cells, show each gene's log2 fold
        change with its 95% confidence interval, log2fc ± 1.96·se. Use R (Rscript is on PATH). Save
        the figure as `figure.pdf` and `figure.png` in the working directory, and the code you used
        as `figure.R`. Report only the word done.
      answer: "done"
