# Figure gallery: one figure per task, drawn with and without the lucid-coder skill; see ../README.md.
# Each prompt describes the input and what to show, and says nothing about style. The answer is
# always `done`; the figure files are the output. Reproducers tasks/<id>-<split>.py draw the
# house-style reference (reference.pdf/.png) through tasks/_gallery.py.

tasks:
  # rule: few points (n < 10 per group): points plus a median, no box (fig.wilke)
  - id: box_few
    train:
      data: [box_few.tsv]
      prompt: >-
        `box_few.tsv` (tab-separated) holds Kang et al. 2018 PBMCs (`ctrl` or `stim`,
        interferon-beta), one row per sample, cell type and gene. Columns: `sample` (donor id; each
        donor appears in one condition only), `condition`, `cell_type`, `gene` and `mean_expr`, the
        mean log-normalised expression (log1p of counts per 10,000) over that sample's cells of that
        type. Compare `mean_expr` of ISG15 in CD14+ Monocytes between the ctrl and stim samples. Use
        R (Rscript is on PATH). Save the figure as `figure.pdf` and `figure.png` in the working
        directory, and the code you used as `figure.R`. Report only the word done.
      answer: "done"
    valid:
      data: [box_few.tsv]
      prompt: >-
        `box_few.tsv` (tab-separated) holds Kang et al. 2018 PBMCs (`ctrl` or `stim`,
        interferon-beta), one row per sample, cell type and gene. Columns: `sample` (donor id; each
        donor appears in one condition only), `condition`, `cell_type`, `gene` and `mean_expr`, the
        mean log-normalised expression (log1p of counts per 10,000) over that sample's cells of that
        type. Compare `mean_expr` of IFI6 in B cells between the ctrl and stim samples. Use R
        (Rscript is on PATH). Save the figure as `figure.pdf` and `figure.png` in the working
        directory, and the code you used as `figure.R`. Report only the word done.
      answer: "done"
    test:
      data: [box_few.tsv]
      prompt: >-
        `box_few.tsv` (tab-separated) holds Kang et al. 2018 PBMCs (`ctrl` or `stim`,
        interferon-beta), one row per sample, cell type and gene. Columns: `sample` (donor id; each
        donor appears in one condition only), `condition`, `cell_type`, `gene` and `mean_expr`, the
        mean log-normalised expression (log1p of counts per 10,000) over that sample's cells of that
        type. Compare `mean_expr` of MX1 in NK cells between the ctrl and stim samples. Use R
        (Rscript is on PATH). Save the figure as `figure.pdf` and `figure.png` in the working
        directory, and the code you used as `figure.R`. Report only the word done.
      answer: "done"
